<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c2c7" />
      <stop offset="100%" stop-color="#007791" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d48208" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152033" />
      <stop offset="100%" stop-color="#0a121e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2d4a6a" stroke-width="1.5" />

  <!-- Blueprint Grid Pattern Subdued -->
  <path d="M 12 12 L 52 12 M 12 22 L 52 22 M 12 32 L 52 32 M 12 42 L 52 42 M 12 52 L 52 52" stroke="#1d3049" stroke-width="0.75" />
  <path d="M 12 12 L 12 52 M 22 12 L 22 52 M 32 12 L 32 52 M 42 12 L 42 52 M 52 12 L 52 52" stroke="#1d3049" stroke-width="0.75" />

  <!-- Structural Frame / Building Tower -->
  <!-- Columns -->
  <rect x="18" y="20" width="4" height="30" rx="1" fill="url(#studioGrad)" />
  <rect x="30" y="14" width="4" height="36" rx="1" fill="url(#studioGrad)" />
  <rect x="42" y="20" width="4" height="30" rx="1" fill="url(#studioGrad)" />

  <!-- Horizontal Grade Beams -->
  <rect x="16" y="22" width="32" height="3" rx="0.5" fill="#00c2c7" filter="url(#glow)" />
  <rect x="16" y="34" width="32" height="3" rx="0.5" fill="#00c2c7" />
  <rect x="14" y="47" width="36" height="4" rx="1" fill="#00c2c7" />

  <!-- Architect Compass / Caliper Pivot in Gold -->
  <path d="M 32 10 L 22 46 M 32 10 L 42 46" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="10" r="3.5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1" />
  <path d="M 25 36 Q 32 32 39 36" stroke="#f5a623" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Center Accent Dot -->
  <circle cx="32" cy="10" r="1.5" fill="#0f1c2e" />
</svg>
